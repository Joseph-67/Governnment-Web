<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Company Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .profile-header {
            background: linear-gradient(to right, #4e73df, #1cc88a);
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
        .card {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <!-- Header -->
        <div class="profile-header text-center">
            <h1>Advanced Company Profile</h1>
            <p>Your company's information at a glance</p>
        </div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-pills nav-fill my-4" id="profileTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="overview-tab" data-bs-toggle="tab" data-bs-target="#overview" type="button" role="tab">Overview</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="policies-tab" data-bs-toggle="tab" data-bs-target="#policies" type="button" role="tab">Policies & Objectives</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="inventory-tab" data-bs-toggle="tab" data-bs-target="#inventory" type="button" role="tab">Inventory Management</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="settings-tab" data-bs-toggle="tab" data-bs-target="#settings" type="button" role="tab">Settings</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button" role="tab">Contact Details</button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="profileTabContent">
            <!-- Overview -->
            <div class="tab-pane fade show active" id="overview" role="tabpanel" aria-labelledby="overview-tab">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Company Name</h5>
                                <p class="card-text">ABC Corp</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Founded</h5>
                                <p class="card-text">1990</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Industry</h5>
                                <p class="card-text">Technology</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Headquarters</h5>
                                <p class="card-text">New York, USA</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Policies & Objectives -->
            <div class="tab-pane fade" id="policies" role="tabpanel" aria-labelledby="policies-tab">
                <h3>Policies & Objectives</h3>
                <p>Define and update company policies and objectives.</p>
                <textarea class="form-control mb-3" rows="5" placeholder="Enter policies and objectives..."></textarea>
                <button class="btn btn-primary">Save</button>
            </div>

            <!-- Inventory Management -->
            <div class="tab-pane fade" id="inventory" role="tabpanel" aria-labelledby="inventory-tab">
                <h3>Inventory Management</h3>
                <div class="accordion" id="inventoryAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="waterHeading">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#waterCollapse" aria-expanded="true" aria-controls="waterCollapse">
                                Water Inventory
                            </button>
                        </h2>
                        <div id="waterCollapse" class="accordion-collapse collapse show" aria-labelledby="waterHeading">
                            <div class="accordion-body">
                                <input type="text" class="form-control" placeholder="Enter water resource details">
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="chemicalHeading">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#chemicalCollapse" aria-expanded="false" aria-controls="chemicalCollapse">
                                Chemical Inventory
                            </button>
                        </h2>
                        <div id="chemicalCollapse" class="accordion-collapse collapse" aria-labelledby="chemicalHeading">
                            <div class="accordion-body">
                                <input type="text" class="form-control" placeholder="Enter chemical details">
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="materialHeading">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#materialCollapse" aria-expanded="false" aria-controls="materialCollapse">
                                Material Inventory
                            </button>
                        </h2>
                        <div id="materialCollapse" class="accordion-collapse collapse" aria-labelledby="materialHeading">
                            <div class="accordion-body">
                                <input type="text" class="form-control" placeholder="Enter material details">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings -->
            <div class="tab-pane fade" id="settings" role="tabpanel" aria-labelledby="settings-tab">
                <h3>Settings</h3>
                <form>
                    <div class="mb-3">
                        <label for="generalSettings" class="form-label">General Settings</label>
                        <input type="text" class="form-control" id="generalSettings" placeholder="Enter general settings">
                    </div>
                    <div class="mb-3">
                        <label for="calendarSetup" class="form-label">Calendar Year</label>
                        <input type="number" class="form-control" id="calendarSetup" placeholder="Enter calendar year">
                    </div>
                    <button class="btn btn-primary">Save Settings</button>
                </form>
            </div>

            <!-- Contact Details -->
            <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">
                <h3>Contact Details</h3>
                <form>
                    <div class="mb-3">
                        <label for="contactName" class="form-label">Contact Person</label>
                        <input type="text" class="form-control" id="contactName" placeholder="Enter contact person name">
                    </div>
                    <div class="mb-3">
                        <label for="contactEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="contactEmail" placeholder="Enter email">
                    </div>
                    <div class="mb-3">
                        <label for="contactPhone" class="form-label">Phone</label>
                        <input type="text" class="form-control" id="contactPhone" placeholder="Enter phone number">
                    </div>
                    <button class="btn btn-primary">Save Contact</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
